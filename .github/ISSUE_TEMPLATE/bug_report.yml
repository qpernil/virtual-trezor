name: Bug report
description: Report incorrect firmware integration, USB, UI, build, or documentation behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or include wallet secrets here. Follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Virtual Trezor revision
      description: Commit hash or tag
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Pi model, OS, kernel, UDC, display backend, and supervisor revision
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host software
      description: Host OS and trezorlib, trezorctl, or Trezor Suite version
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or measurements
      description: Remove seeds, passphrases, state, keys, USB serials, and other sensitive data.
      render: text
