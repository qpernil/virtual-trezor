schema = 1
name = "virtual-trezor-st7789"
functionfs_mount = "/dev/ffs-virtual-trezor-st7789"

[worker]
command = "/absolute/path/to/virtual-trezor-worker"
arguments = ["--display=st7789-spi"]
run_as = "worker-account"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor-st7789"
runtime_directory = "/run/virtual-trezor-st7789"

[[resources]]
type = "character-device"
name = "display-spi"
path = "/dev/spidev0.0"
access = "read-write"

[[resources]]
type = "gpio-lines"
name = "display-control"
path = "/dev/gpiochip0"
offsets = [25, 27, 24]
direction = "output"
initial_values = [false, false, false]

[[resources]]
type = "gpio-lines"
name = "buttons"
path = "/dev/gpiochip0"
offsets = [5, 26, 13]
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"
