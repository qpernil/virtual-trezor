schema = 1
name = "virtual-trezor-st7789"

[usb]
vendor_id = 0x1209
product_id = 0x53c1
bcd_usb = 0x0210
# 1.01 distinguishes the WinUSB-capable descriptor set from the earlier 1.00
# device, for which Windows may have cached the absence of Microsoft OS data.
bcd_device = 0x0101
max_speed = "full-speed"
device_class = 0
device_subclass = 0
device_protocol = 0
manufacturer = "Virtual Trezor"
product = "Virtual Trezor"
serial = "virtual-trezor-one-st7789"
max_power_ma = 100

[usb.microsoft_os_1]
vendor_code = 0x21
signature = "MSFT100"

[usb.webusb]
version = 0x0100
vendor_code = 0x01
landing_page = ""

[worker]
command = "/absolute/path/to/virtual-trezor-worker"
arguments = ["--display=st7789-spi"]
run_as = "worker-account"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor-st7789"
runtime_directory = "/run/virtual-trezor-st7789"

[[resources]]
type = "character-device"
name = "display-spi"
path = "/dev/spidev0.0"
access = "read-write"

[[resources]]
type = "gpio-lines"
name = "display-control"
path = "/dev/gpiochip0"
offsets = [25, 27, 24] # D/C, reset, backlight
direction = "output"
initial_values = [false, false, false]

[[resources]]
type = "gpio-lines"
name = "buttons"
path = "/dev/gpiochip0"
offsets = [5, 26, 13] # left/No, right/Yes, center/both
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"

[[functions]]
type = "functionfs"
name = "trezor"
mount = "/dev/ffs-virtual-trezor-st7789"
