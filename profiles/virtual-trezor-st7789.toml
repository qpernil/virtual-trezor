schema = 1
name = "virtual-trezor-st7789"

[usb]
vendor_id = 0x1209
product_id = 0x53c1
bcd_usb = 0x0210
bcd_device = 0x0100
max_speed = "full-speed"
device_class = 0
device_subclass = 0
device_protocol = 0
manufacturer = "Virtual Trezor"
product = "Virtual Trezor"
serial = "virtual-trezor-one-st7789"
max_power_ma = 100

[worker]
command = "/absolute/path/to/virtual-trezor-worker"
arguments = ["--display=st7789-spi"]
run_as = "worker-account"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor-st7789"
runtime_directory = "/run/virtual-trezor-st7789"

[[resources]]
type = "character-device"
name = "display-spi"
path = "/dev/spidev0.0"
access = "read-write"

[[resources]]
type = "gpio-lines"
name = "display-control"
path = "/dev/gpiochip0"
offsets = [25, 27, 24] # D/C, reset, backlight
direction = "output"
initial_values = [false, false, false]

[[resources]]
type = "gpio-lines"
name = "buttons"
path = "/dev/gpiochip0"
offsets = [5, 26, 13] # left/No, right/Yes, center/both
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"

[[functions]]
type = "functionfs"
name = "trezor"
mount = "/dev/ffs-virtual-trezor-st7789"
descriptors_hex = """
03 00 00 00 42 00 00 00 03 00 00 00 03 00 00 00
03 00 00 00
09 04 00 00 02 ff 00 00 01
07 05 01 03 40 00 01 07 05 81 03 40 00 01
09 04 00 00 02 ff 00 00 01
07 05 01 03 40 00 04 07 05 81 03 40 00 04
"""
strings_hex = """
02 00 00 00 23 00 00 00 01 00 00 00 01 00 00 00
09 04 54 52 45 5a 4f 52 20 49 6e 74 65 72 66 61
63 65 00
"""
