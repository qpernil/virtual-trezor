schema = 1
name = "virtual-trezor-i2c"

[usb]
vendor_id = 0x1209
product_id = 0x53c1
bcd_usb = 0x0210
bcd_device = 0x0100
max_speed = "full-speed"
device_class = 0
device_subclass = 0
device_protocol = 0
manufacturer = "Virtual Trezor"
product = "Virtual Trezor"
serial = "virtual-trezor-one"
max_power_ma = 100

[worker]
command = "/home/per/virtual-trezor/build/virtual-trezor-worker"
arguments = ["--display=sh1106-i2c"]
run_as = "per"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor"
runtime_directory = "/run/virtual-trezor"

[[resources]]
name = "display-i2c"
path = "/dev/i2c-1"
access = "read-write"

[[resources]]
name = "display-gpio"
path = "/dev/gpiochip0"
access = "read-write"

[[functions]]
type = "functionfs"
name = "trezor"
mount = "/dev/ffs-virtual-trezor"
descriptors_hex = """
03 00 00 00 42 00 00 00 03 00 00 00 03 00 00 00
03 00 00 00
09 04 00 00 02 ff 00 00 01
07 05 01 03 40 00 01 07 05 81 03 40 00 01
09 04 00 00 02 ff 00 00 01
07 05 01 03 40 00 04 07 05 81 03 40 00 04
"""
strings_hex = """
02 00 00 00 23 00 00 00 01 00 00 00 01 00 00 00
09 04 54 52 45 5a 4f 52 20 49 6e 74 65 72 66 61
63 65 00
"""
