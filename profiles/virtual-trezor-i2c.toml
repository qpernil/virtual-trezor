schema = 1
name = "virtual-trezor-i2c"
functionfs_mount = "/dev/ffs-virtual-trezor"

[worker]
command = "/absolute/path/to/virtual-trezor-worker"
arguments = ["--display=sh1106-i2c"]
run_as = "worker-account"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor"
runtime_directory = "/run/virtual-trezor"

[[resources]]
type = "character-device"
name = "display-i2c"
path = "/dev/i2c-1"
access = "read-write"

[[resources]]
type = "gpio-lines"
name = "display-control"
path = "/dev/gpiochip0"
offsets = [25]
direction = "output"
initial_values = [false]

[[resources]]
type = "gpio-lines"
name = "buttons"
path = "/dev/gpiochip0"
offsets = [5, 26, 13]
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"
