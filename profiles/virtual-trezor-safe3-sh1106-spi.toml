schema = 1
name = "virtual-trezor-safe3-sh1106-spi"
functionfs_mount = "/dev/ffs-virtual-trezor-safe3-sh1106-spi"

[worker]
command = "/absolute/path/to/virtual-trezor-safe3-usb"
arguments = ["/absolute/path/to/trezor-firmware/core/src/main.py"]
run_as = "worker-account"
readiness_timeout_ms = 30000
state_directory = "/var/lib/virtual-trezor-safe3"
runtime_directory = "/run/virtual-trezor-safe3-sh1106-spi"

[[resources]]
type = "character-device"
name = "display-sh1106-spi"
path = "/dev/spidev0.0"
access = "read-write"

[[resources]]
type = "gpio-lines"
name = "display-control"
path = "/dev/gpiochip0"
offsets = [24, 25]
direction = "output"
initial_values = [false, false]

[[resources]]
type = "gpio-lines"
name = "buttons"
path = "/dev/gpiochip0"
offsets = [5, 26, 13]
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"

[[resources]]
type = "gpio-lines"
name = "reconnect-button"
path = "/dev/gpiochip0"
offsets = [16]
direction = "input"
active_low = true
bias = "pull-up"
edge = "both"
